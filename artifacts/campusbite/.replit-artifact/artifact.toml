kind = "web"
previewPath = "/"
title = "CampusBite"
description = "A vegetarian college canteen app for browsing its existing menu, managing a cart, and tracking orders through an automatic kitchen preparation queue."
version = "1.0.0"
id = "artifacts/campusbite"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 26046

[services.development]
run = "pnpm --filter @workspace/campusbite run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/campusbite", "run", "build" ]
serve = "static"
publicDir = "artifacts/campusbite/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26046"
BASE_PATH = "/"
